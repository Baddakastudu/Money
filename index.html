<template id="exp-tpl"><style>
:host{
  color-scheme: light;
  --bg:#f2f4f8; --card:#ffffff; --line:#e6e9ef; --soft:#f6f7fa;
  --ink:#0f1222; --ink2:#4d5368; --ink3:#8a90a2;
  --accent:#2a78d6; --accent2:#6250d6;
  --good:#008300; --warn:#b87900; --warnbg:#fff4dc; --bad:#d03b3b; --badbg:#fde8e8; --goodbg:#e4f5e4;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:host,.root{margin:0}
.root{background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 48px env(safe-area-inset-left)}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}
.num{font-variant-numeric:tabular-nums}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 8px}
.top h1{font-size:26px;margin:0;letter-spacing:-.02em}
.top .sub{font-size:12.5px;color:var(--ink3)}
.iconbtn{border:0;background:var(--card);box-shadow:var(--shadow);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;color:var(--ink)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;
  padding:7px 14px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2fbf71;margin-left:6px;vertical-align:1px}
.custom{display:none;gap:10px;align-items:end;margin:-4px 0 12px;flex-wrap:wrap}
.custom.on{display:flex}
/* hero */
.hero{border-radius:22px;padding:18px 18px 16px;color:#fff;margin-bottom:12px;
  background:linear-gradient(135deg,#2a78d6 0%,#4a5fd8 55%,#6250d6 100%);box-shadow:0 8px 24px rgba(42,120,214,.28)}
.hero .cyc{font-size:13px;opacity:.85;margin-bottom:12px}
.hero .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hero .l{font-size:12px;opacity:.8}
.hero .v{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:2px;line-height:1.15}
.hero .v small{font-size:12px;font-weight:600;opacity:.8;margin-right:3px}
.hero .n{font-size:11.5px;opacity:.75;margin-top:2px}
.hero .spent .v{font-size:26px}
@media (max-width:560px){.hero .three{grid-template-columns:1fr 1fr}.hero .spent{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.22);padding-top:10px}}
.bud{margin-top:14px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.bud .bar{position:relative;height:10px;background:rgba(255,255,255,.25);border-radius:6px;overflow:visible;margin:8px 0 6px}
.bud .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:#fff}
.bud .fill.warn{background:#ffd166}.bud .fill.bad{background:#ff8a8a}
.bud .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;opacity:.9;border-radius:1px}
.bud .row{display:flex;justify-content:space-between;font-size:12.5px;gap:8px;flex-wrap:wrap}
.bud .setb{background:none;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:14px;font-weight:500}
.alert.bad{background:var(--badbg);color:#8f1f1f}.alert.warn{background:var(--warnbg);color:#7a5000}.alert.good{background:var(--goodbg);color:#0d5b0d}
.alert .ic{font-size:17px;line-height:1.2}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media (max-width:700px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.tile .ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.tile .l{font-size:12px;color:var(--ink3)}
.tile .v{font-size:16px;font-weight:650}
/* cards */
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0;letter-spacing:-.01em}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.ch .hint{font-size:12px;color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;padding:4px 0}
/* category rows */
.crow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--soft);cursor:pointer}
.crow:last-child{border-bottom:0}
.cic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.crow .nm{font-size:14px;font-weight:550;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crow .meta{font-size:12px;color:var(--ink3)}
.crow .amt{text-align:right;font-weight:650;font-size:14px}
.crow .amt .meta{font-weight:400}
.track{height:6px;background:var(--soft);border-radius:4px;margin-top:6px;overflow:hidden}
.track .f{height:100%;border-radius:0 4px 4px 0}
.st{font-size:11px;font-weight:650;border-radius:999px;padding:1px 7px}
.st.warn{background:var(--warnbg);color:#7a5000}.st.bad{background:var(--badbg);color:#8f1f1f}
/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
#tip{position:fixed;pointer-events:none;background:#0f1222;color:#fff;font-size:12px;padding:7px 10px;border-radius:9px;
  opacity:0;transition:opacity .1s;z-index:50;max-width:250px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
/* merchants */
.mrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 0;font-size:14px;border-bottom:1px solid var(--soft)}
.mrow:last-child{border-bottom:0}
.rank{width:28px;height:28px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-size:12px;color:var(--ink2);font-weight:600}
.mrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* transactions */
.tools{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.search{flex:1;min-width:160px}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(42,120,214,.35);border-color:var(--accent)}
.tools select{width:auto;max-width:48%}
textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.dayh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ink3);padding:14px 2px 4px;text-transform:uppercase;letter-spacing:.04em}
.trow{display:grid;grid-template-columns:40px 1fr auto;gap:11px;align-items:center;padding:9px 2px;cursor:pointer;border-radius:12px}
.trow:active{background:var(--soft)}
.trow .nm{font-weight:550;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .meta{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .amt{font-weight:650;text-align:right;white-space:nowrap}
.trow .amt.cr{color:var(--good)}
.trow .amt .meta{font-weight:400;text-align:right}
.badge{display:inline-block;font-size:10.5px;font-weight:650;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--ink2);margin-left:4px;vertical-align:1px}
.empty{color:var(--ink3);font-size:14px;padding:22px 0;text-align:center}
.more{display:block;width:100%;margin-top:8px}
/* buttons */
.btn{font:inherit;font-size:14.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:550}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2);font-weight:550;margin-bottom:10px}
label.ck{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink2);margin:6px 0 10px}
label.ck input{width:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=file]{display:none}
.msg{font-size:13px;color:var(--ink2)}
.status{font-size:13px;color:var(--ink2);margin:0 2px 10px;min-height:0}
/* unrecognised */
.ucount{background:var(--badbg);color:#8f1f1f;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
details.u{border:1px solid var(--line);border-radius:14px;margin-top:8px;background:var(--card)}
details.u>summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;gap:10px;align-items:flex-start}
details.u>summary::-webkit-details-marker{display:none}
details.u>summary .chev{margin-left:auto;color:var(--ink3);transition:transform .15s}
details.u[open]>summary .chev{transform:rotate(90deg)}
details.u .body{padding:0 12px 12px}
.smsbox{background:var(--soft);border-radius:10px;padding:9px 10px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;margin-bottom:10px;color:var(--ink2)}
details.plain>summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between}
details.plain>summary::-webkit-details-marker{display:none}
details.plain>summary::after{content:"›";color:var(--ink3);transition:transform .15s}
details.plain[open]>summary::after{transform:rotate(90deg)}
/* v3 */
.fyrow{display:flex;gap:8px;align-items:center;padding:4px 2px 0}
.fyrow select{width:auto;padding:7px 10px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--card)}
.chip:disabled{opacity:.35;cursor:default}
#syncChip{font-size:12.5px;padding:6px 11px}
#syncChip.warn{background:var(--warnbg);border-color:#f0d9a8;color:#7a5000}
.accs{display:flex;gap:10px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.accs::-webkit-scrollbar{display:none}
.acc{flex:1 0 210px;max-width:340px}
.acc{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent}
.acc.on{border-color:var(--accent)}
.acc .h{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);font-weight:600}
.acc .b{font-size:19px;font-weight:700;margin-top:4px}
.acc .s{font-size:12px;color:var(--ink3)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--soft);color:var(--ink2);border-radius:10px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.rv{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:8px}
.rv .top1{display:flex;gap:10px;align-items:center}
.rv .q{font-size:14px;margin:8px 0 2px}
.rv .why{font-size:12px;color:var(--ink3)}
.rcount{background:#e8e6fb;color:#3b2fa0;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px;vertical-align:1px}
.cdot.high{background:#1baf7a}.cdot.medium{background:#eda100}.cdot.low{background:#d03b3b}

function buildTemplate(text,amount,merchant){

  const starts=[]; dated.filter(t=>t.salary).forEach(t=>{
    if(starts.length&&t.date-starts[starts.length-1].date<20*864e5) return;
    if(starts.length>=1){ const a=starts.map(x=>x.amount).sort((x,y)=>x-y), med=a[Math.floor(a.length/2)]; if(t.amount<med*0.5) return; }
    starts.push(t); });
  if(!starts.length){
    let d=new Date(first.getFullYear(),first.getMonth(),1);
    while(d<=now||cyc.length===0){ const e=new Date(d.getFullYear(),d.getMonth()+1,1);
      cyc.push({start:d,end:e,open:now>=d&&now<e,label:MONL[d.getMonth()]+" "+d.getFullYear(),short:MON[d.getMonth()]+" "+d.getFullYear(),kind:"calendar",lm:d.getMonth(),ly:d.getFullYear()}); d=e; if(cyc.length>120) break; }
  } else {
    if(first<starts[0].date) cyc.push({start:startOfDay(first),end:starts[0].date,open:false,partial:true});
    starts.forEach((s,i)=>cyc.push({start:s.date,end:i+1<starts.length?starts[i+1].date:null,salaryTx:s,open:i+1===starts.length}));
    const used={};

      c.label=lab; c.short=sh; c.kind="salary"; c.lm=mid.getMonth(); c.ly=mid.getFullYear(); });
  }
  return cyc.reverse();
}

function computeView(w){
  const now=new Date();
  const inW=w?ALL.filter(t=>t.date&&t.date>=w.start&&(!w.end||t.date<w.end)):[];
  const spend=inW.filter(t=>t.counts&&t.spendAmt>0.0005), sent=inW.filter(t=>t.remit), loan=inW.filter(t=>t.loan), returned=inW.filter(t=>t.returned), lent=inW.filter(t=>t.lent), credits=inW.filter(t=>t.type==="credit");
  const salary=credits.filter(t=>t.salary), otherIn=credits.filter(t=>!t.salary&&!t.returned&&!t.own);
  const extraBack=returned.reduce((a,t)=>a+(t.retLeft||0),0);
  // balances
  const balTx=inW.filter(t=>t.balance!=null&&t.balance_type==="available_balance");
  let acct=w&&w.salaryTx&&w.salaryTx.account_last4;
  if(!acct){ const cnt={}; balTx.forEach(t=>{ if(t.account_last4) cnt[t.account_last4]=(cnt[t.account_last4]||0)+1; });
    acct=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||null; }
  const ab=balTx.filter(t=>!acct||!t.account_last4||t.account_last4===acct).sort((a,b)=>a.date-b.date);
  let opening=null, openNote="no balance in SMS", current=null, curNote="no balance in SMS";
  const st=w&&w.salaryTx;
  if(st&&st.balance!=null&&st.balance_type==="available_balance"){ opening=st.balance; openNote="on salary day · "+dshort(st.date)+" "+hm(st.date); }
  else if(st){ const prev=ALL.filter(t=>t.date&&t.date<st.date&&t.balance!=null&&t.balance_type==="available_balance"&&(!st.account_last4||!t.account_last4||t.account_last4===st.account_last4)).sort((a,b)=>b.date-a.date)[0];
    if(prev){ opening=prev.balance+st.amount; openNote="on salary day · "+dshort(st.date)+" (worked out)"; } else { opening=st.amount; openNote="salary only · no balance in SMS"; } }
  else if(ab.length){ const f=ab[0]; opening=f.type==="debit"?f.balance+f.amount:f.balance-f.amount; openNote="at start · "+dshort(f.date); }
  if(ab.length){ const l=ab[ab.length-1]; current=l.balance; curNote="as of "+dshort(l.date)+" "+hm(l.date); }
  // days
  let total=1, elapsed=1;
  if(w){ const endE=w.end||(w.kind==="salary"&&w.open?addMonths(w.start,1):now);
    total=Math.max(1,Math.round((startOfDay(endE)-startOfDay(w.start))/864e5));
    elapsed=w.open?Math.min(total,Math.max(1,Math.floor((startOfDay(now)-startOfDay(w.start))/864e5)+1)):total; }

  return {w,inW,spend,sent,credits,salary,otherIn,opening,openNote,current,curNote,acct,total,elapsed,
    daysLeft:w&&w.open?Math.max(1,total-elapsed+1):0,spent,sentAmt:sum(sent),loanAmt:sum(loan),lentAmt:lent.reduce((a,t)=>a+t.spendAmt,0),returnedAmt:sum(returned),returned,salaryAmt:sum(salary),otherInAmt:sum(otherIn)+extraBack};
}

/* ---------- health check ---------- */
function balanceGaps(){
  const groups={};
  ALL.filter(t=>t.date&&t.balance!=null&&t.balance_type).forEach(t=>{ const k=t.balance_type+"|"+(t.account_last4||"?"); (groups[k]=groups[k]||[]).push(t); });
  const gaps=[], checked=[];
  for(const k in groups){ const g=groups[k].slice().sort((a,b)=>a.date-b.date);
    for(let i=1;i<g.length;i++){ const p=g[i-1], c=g[i];
      const exp=p.balance+(c.type==="credit"?1:-1)*c.amount; const diff=r3(c.balance-exp);
      if(Math.abs(diff)<0.001){ checked.push(c); continue; }
      if(i+1<g.length&&g[i+1].date-c.date<180e3){ const n=g[i+1]; if(Math.abs(n.balance-(p.balance+(n.type==="credit"?1:-1)*n.amount))<0.001){ g[i]=n; g[i+1]=c; i--; continue; } }
      checked.push(c); gaps.push({p,c,diff}); } }
  return {gaps,checked};
}
function renderHealth(V){
  const w=V.w; if(!w){ $("healthCard").style.display="none"; return; }
  const inWin=d=>d&&d>=w.start&&(!w.end||d<w.end);
  const {gaps,checked}=balanceGaps();
  const g=gaps.filter(x=>inWin(x.c.date)), nChecks=checked.filter(t=>inWin(t.date)).length;
  const newFmt=V.inW.filter(t=>t.how==="new format"), nf=NEEDFIX.filter(x=>inWin(x.m.date));
  const totalMsgs=V.inW.length+nf.length; let h="";
  if(newFmt.length+nf.length>=3&&(newFmt.length+nf.length)/Math.max(1,totalMsgs)>=0.2){
    const cnt={}; newFmt.forEach(t=>cnt[t.sender||"?"]=(cnt[t.sender||"?"]||0)+1); nf.forEach(x=>cnt[x.m.sender||"?"]=(cnt[x.m.sender||"?"]||0)+1);
    const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
    h+='<div class="alert warn"><span class="ic">⚠️</span><span>'+(newFmt.length+nf.length)+' SMS this period were in a format the dashboard didn’t know'+(top&&top!=="?"?' (mostly from '+esc(top)+')':'')+'. The bank may have changed its wording. Check the ones marked “new format” and anything under “Needs your check”.</span></div>';
  }
  if(g.length){
    h+='<div class="msg" style="margin-bottom:6px">Each SMS balance should equal the previous balance ± the amount. These don’t add up:</div>';
    h+=g.slice(0,6).map(x=>{ const lab=(x.c.balance_type==="available_limit"?"Card":"Account")+(x.c.account_last4?" ••"+esc(x.c.account_last4):"");
      return '<div class="lrow" style="align-items:flex-start"><span><b>'+lab+'</b> · '+dshort(x.p.date)+' '+hm(x.p.date)+' → '+dshort(x.c.date)+' '+hm(x.c.date)+
        '<div class="msg">'+(x.diff<0?fmtK(-x.diff)+' went out with no SMS to explain it — a money-out SMS may be missing or misread.':fmtK(x.diff)+' came in with no SMS to explain it — a money-in SMS may be missing.')+'</div></span>'+
        '<span class="num" style="font-weight:650;color:'+(x.diff<0?'var(--bad)':'var(--good)')+'">'+(x.diff<0?"−":"+")+fmt(Math.abs(x.diff))+'</span></div>'; }).join("");
    if(g.length>6) h+='<div class="msg" style="margin-top:6px">…and '+(g.length-6)+' more.</div>';
    h+='<div class="msg" style="margin-top:8px">Missing one? Add it under “Add a missed SMS” at the bottom.</div>';
  } else if(nChecks){
    h+='<div class="alert good" style="margin:0"><span class="ic">✅</span><span>All '+nChecks+' balance checks add up — no SMS look missing this period.</span></div>';
  }
  $("healthCard").style.display=h?"":"none"; $("health").innerHTML=h;
}

function status(t){ $("status").textContent=t; clearTimeout(status.t); status.t=setTimeout(()=>{$("status").textContent="";},6000); }
/* one loader for every kind of file: SMS logs, expense_data.json, old settings or report files */
function isSettingsObj(o){ return o&&typeof o==="object"&&!Array.isArray(o)&&(o.budgets||o.merchants||o.templates||o.fixes||o.txOverrides||o.extraMessages||o.userRules); }
function loadAnyText(text){
  const res={settings:false,msgs:0,kind:"log"}; let o=null;
  try{ o=JSON.parse(String(text).replace(/^\uFEFF/,"")); }catch(e){}
  if(o&&typeof o==="object"&&!Array.isArray(o)){
    const st=isSettingsObj(o.settings)?o.settings:isSettingsObj(o)?o:null;
    if(st){ S=mergeSettings(S,normSettings(st)); SNAP=flatSettings(S); rules=compileRules(rulesText()); store.set("exp_settings_v2",JSON.stringify(S)); store.set("exp_saved_at",String(S.updated||0)); res.settings=true; }
    const rows=[]; (o.months||[]).forEach(m=>(m.transactions||[]).forEach(t=>rows.push(t)));
    (o.transactions||[]).forEach(t=>rows.push(t)); (o.needs_check||[]).forEach(t=>rows.push(t)); (o.unparsed_messages||[]).forEach(t=>rows.push(t));
    const ms=rows.filter(t=>t&&typeof t.sms==="string"&&t.sms.trim()).map(t=>({date:parseDate(t.date),sender:t.sender||"",text:t.sms}));
    if(ms.length){ logMessages=logMessages.concat(ms); res.msgs=ms.length; }
    if(res.settings||res.msgs){ res.kind="backup"; return res; }
  }
  const ms=textToMessages(text); logMessages=logMessages.concat(ms); res.msgs=ms.length; return res;
}
function cacheLog(){ try{ const seen=new Set(); const out=[];
  logMessages.forEach(m=>{ const k=msgKey(m); if(seen.has(k)) return; seen.add(k); out.push({d:m.date?m.date.toISOString():null,s:m.sender||"",t:m.text}); });
  store.set("exp_log_cache",JSON.stringify(out)); }catch(e){} }
async function onFiles(e){
  const files=[...e.target.files]; e.target.value=""; if(!files.length) return;
  const before=allMessages().length; let restored=false, msgs=0, bad=[];
  for(const f of files){ let r; try{ r=loadAnyText(await f.text()); }catch(err){ bad.push(f.name); continue; }
    if(r.settings) restored=true; msgs+=r.msgs; if(!r.settings&&!r.msgs) bad.push(f.name); }

  if(bud){ const p=V.spent/bud, pace=V.total?V.elapsed/V.total:1, cls=p>1?"bad":p>pace+0.1?"warn":"";
    budHtml=`<div class="pbar"><i class="${cls}" style="width:${Math.min(100,p*100).toFixed(1)}%"></i></div><div class="note">${k3(Math.max(0,bud-V.spent))} left of ${k3(bud)} budget${V.daysLeft?" · "+V.daysLeft+(V.daysLeft===1?" day":" days")+" to go":""}</div>`; }
  else if(V.daysLeft) budHtml=`<div class="note" style="margin-top:8px">${V.daysLeft} days until next salary (about)</div>`;
  return `<div class="gh">${esc(C[0].label||"This month")}</div><div class="grp"><button class="cell sumcard" data-go="exp" style="display:block">
    <div class="lab">Money now</div><div class="big">${k3(V.current!=null?V.current:V.opening)}<small>KWD</small></div><div class="note">${esc(V.current!=null?V.curNote:V.openNote)}</div>
    <div class="two"><div><div class="lab">Spent</div><div class="mid">${k3(V.spent)}</div></div><div><div class="lab">Started with</div><div class="mid">${k3(V.opening)}</div></div></div>
    ${budHtml}</button></div>`;
}
function salaryCard(){
  const sal=salaries(), ready=payReady(); const rows=[];
  if(!ready&&!sal.length) return "";
  if(sal.length){ const s=sal[0], pm=payMonthOfCredit(s.date), r=ready?predict(pm):null;
    rows.push(`<div class="cell static"><div class="t">${MONL[+pm.slice(5)-1]} salary received<small>${dShort(s.date)} · from bank SMS</small></div><span class="v" style="color:var(--i-label)">${k3(s.amount)}</span></div>`);
    if(r){ const diff=s.amount-r.net, same=Math.abs(diff)<0.0015;
      rows.push(`<div class="cell static"><div class="t">Shift Pay predicted</div><span class="v">${k3(r.net)}</span></div>`);
      rows.push(`<div class="cell static"><div class="t">Difference</div><span class="v ${same?"pos":diff>0?"pos":"neg"}">${same?"✓ matches":(diff>0?"+":"−")+k3(Math.abs(diff))}</span></div>`); }
    if(ready){ const nm=addMon(pm,1), n=predict(nm); if(n) rows.push(`<button class="cell" data-go="salary"><div class="t">${MONL[+nm.slice(5)-1]} salary (predicted)<small>expected around ${s.date.getDate()} ${MONS[+nm.slice(5)-1]}</small></div><span class="v" style="color:var(--i-label);font-weight:600">${k3(n.net)}</span><span class="chev">›</span></button>`); }
  } else { const pm=PAY.S.mon, r=predict(pm);
    rows.push(`<button class="cell" data-go="salary"><div class="t">${monName(pm)} (predicted)<small>No salary SMS yet to compare</small></div><span class="v" style="color:var(--i-label);font-weight:600">${r?k3(r.net):"—"}</span><span class="chev">›</span></button>`); }
  return `<div class="gh">Salary</div><div class="grp">${rows.join("")}</div>`;
}
function catCard(){
  const C=expCycles(); if(!C.length) return ""; const V=EXP.computeView(C[0]), L=catTotals(V).slice(0,5); if(!L.length) return "";
  const max=L[0][1]||1;
  return `<div class="gh">Where it went</div><div class="grp">${L.map(([c,a])=>`<button class="cell ic" data-go="exp"><div class="catrow" style="flex:1"><div class="ibox" style="background:var(--i-fill)">${EXP.catIcon(c)}</div><div style="min-width:0"><div style="font-size:16px">${esc(c)}</div><div class="bar"><i style="width:${(a/max*100).toFixed(1)}%;background:${EXP.catColor(c)}"></i></div></div><span class="v" style="color:var(--i-label);font-variant-numeric:tabular-nums">${k3(a)}</span></div></button>`).join("")}</div>`;
}
function homeCard(){
  const C=expCycles(); if(!C.length) return ""; const V=EXP.computeView(C[0]);
  const R=remits(), missing=payReady()?R.filter(t=>t.date>new Date(Date.now()-120*864e5)&&!fxMatch(t)):[];
  if(!V.sentAmt&&!missing.length) return "";
  return `<div class="gh">Sent home</div><div class="grp"><div class="cell static ic"><div class="ibox" style="background:var(--i-fill)">💸</div><div class="t">This month<small>${V.sent.length} transfer${V.sent.length===1?"":"s"} · from bank SMS</small></div><span class="v" style="color:var(--i-label)">${k3(V.sentAmt)}</span></div>
   ${missing.length?`<button class="cell ic" data-go="fx"><div class="ibox" style="background:var(--i-orangebg)">⚠️</div><div class="t">${missing.length} not yet in Exchanges<small>Add the rate to track INR received</small></div><span class="chev">›</span></button>`:""}</div>`;
}
function renderHome(){
  const d=new Date(); $s("homeDate").textContent=d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  let h=""; for(const f of [shiftCard,monthCard,salaryCard,catCard,homeCard]){ try{ h+=f(); }catch(e){ console.error(e); } }
  $s("home").innerHTML=h+`<p class="gf" style="margin-top:22px;text-align:center">Everything stays on this iPhone · Money ${APP_VERSION}</p>`;
}
$s("home").addEventListener("click",e=>{ const b=e.target.closest("[data-go],[data-act]"); if(!b) return;
  if(b.dataset.act==="update"){ go("exp"); EXP&&EXP.update(); return; } go(b.dataset.go,{from:"home"}); });

/* ---------- More ---------- */
function cell(icon,bg,title,sub,attr,chev){ return `<button class="cell ic${chev===false?" act":""}" ${attr}><div class="ibox" style="background:${bg};color:#fff">${icon}</div><div class="t">${title}${sub?`<small>${sub}</small>`:""}</div>${chev===false?"":'<span class="chev">›</span>'}</button>`; }
function renderMore(){
  let payV="", expV="";
  try{ payV=(PAYM.root.querySelector(".sub span")||{}).textContent||""; }catch(e){}
  try{ expV=(EXP.el("ver")||{}).textContent||""; }catch(e){}
  $s("more").innerHTML=`
  <div class="gh">Backup &amp; sync</div><div class="grp">
   ${cell("📦","#34c759","Back up everything","One file: Shift Pay + Expenses settings"+(lastAll()?" · last "+lastAll():""),'data-act="backupAll"',false)}
   ${cell("♻️","#30b0c7","Restore from a backup","Full backup, Shift Pay backup or expense_data.json",'data-act="restore"',false)}
   ${cell("📥","#007aff","Load new SMS","Pick Total.txt and expense_data.json",'data-act="update"',false)}
   ${cell("☁️","#32ade6","Save to iCloud","expense_data.json · keeps your laptop in step",'data-act="save"',false)}
   ${cell("🗂","#5ac8fa","Shift Pay backup & saved months","Shift Pay only, CSV of saved months",'data-go="data"')}</div>
  <p class="gf">Your SMS are not in backups — they always come from Total.txt.</p><input type="file" id="restoreFile" accept=".json,application/json,text/plain" hidden>
  <div class="gh">Shift Pay</div><div class="grp">
   ${cell("🌴","#34c759","Leaves","Leave records, balance and entitlement",'data-go="leaves"')}
   ${cell("₹","#ff9500","Exchanges to India","Your list + transfers found in bank SMS",'data-go="fx"')}</div>
  <div class="gh">Expenses</div><div class="grp">
   ${cell("🎯","#ff2d55","Budgets","",'data-act="budgets"')}
   ${cell("⚙️","#8e8e93","Expenses settings","Categories, rules, learned merchants",'data-act="settings"')}</div>
  <div class="gh">Appearance</div><div class="grp"><div class="cell static"><div class="look" id="look" style="flex:1">${["light","dark","auto"].map(v=>`<button type="button" data-look="${v}" aria-pressed="${getLook()===v}">${{light:"☀️ Light",dark:"🌙 Dark",auto:"Automatic"}[v]}</button>`).join("")}</div></div></div>
  <p class="gf">Automatic follows your iPhone's Dark Mode.</p>
  <div class="gh">About</div><div class="grp">
   <div class="cell static"><div class="t">Money</div><span class="v">${APP_VERSION}</span></div>
   <div class="cell static"><div class="t">Expenses</div><span class="v">${esc(expV)}</span></div>
   <div class="cell static"><div class="t">Shift Pay</div><span class="v">${esc(payV.replace(/^Version\s*/,""))}</span></div></div>
  <p class="gf">Private by design: this app works offline and can't send anything to the internet. Your data stays on this iPhone and in the iCloud files you choose.</p>`;
}
function getLook(){ try{ return localStorage.getItem("money_look")||"light"; }catch(e){ return "light"; } }
function applyLook(v){ document.documentElement.dataset.look=v;
  const dark=v==="dark"||(v==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  try{ PAYM.host.dataset.theme=dark?"dark":"light"; }catch(_){}
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{ m.removeAttribute("media"); m.content=dark?"#000000":"#f2f2f7"; }); }
applyLook(getLook());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>applyLook(getLook()));
$s("more").addEventListener("click",e=>{ const lk=e.target.closest("button[data-look]"); if(lk){ try{localStorage.setItem("money_look",lk.dataset.look)}catch(_){}
  applyLook(lk.dataset.look); document.querySelectorAll("#look button").forEach(b=>b.setAttribute("aria-pressed",b===lk)); return; } });
$s("more").addEventListener("click",e=>{ if(e.target.closest("button[data-look]")) return; const b=e.target.closest("[data-go],[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(!a) return go(b.dataset.go,{from:"more"});
  if(a==="backupAll") return backupAll();
  if(a==="restore") return $s("restoreFile").click();
  if(!EXP) return;
  if(a==="save") return EXP.saveToICloud();
  go("exp");
  if(a==="update") EXP.update(); else if(a==="budgets") EXP.openBudgets(); else if(a==="settings") EXP.openSettings(); });

/* ---------- backups ---------- */
function lastAll(){ try{ const t=+localStorage.getItem("money_backup_at"); return t?new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short"}):""; }catch(e){ return ""; } }
async function saveFile(name,text){
  const blob=new Blob([text],{type:"application/json"});
  try{ const f=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); return true; } }
  catch(e){ if(e&&e.name==="AbortError") return false; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return true;
}
async function backupAll(){
  const d=new Date(), o={app:"money",version:1,exported:d.toISOString(),money_version:APP_VERSION};
  if(PAY) o.shiftpay=JSON.parse(PAY.makeBackup());
  if(EXP) o.expenses=EXP.buildAll();
  const ok=await saveFile("money-backup-"+dayKey(d)+".json",JSON.stringify(o,null,1));
  if(ok){ try{ localStorage.setItem("money_backup_at",String(Date.now())); }catch(e){} if(PAY) PAY.markBackedUp(); renderMore(); toast("Backup ready — keep it in Files › iCloud Drive."); }
}
async function restoreText(text,name){
  let o=null; try{ o=JSON.parse(String(text).replace(/^\uFEFF/,"")); }catch(e){}
  if(o&&o.app==="money"){
    if(o.expenses&&EXP){ go("exp"); await EXP.importFiles([new File([JSON.stringify(o.expenses)],"expense_data.json")]); }
    if(o.shiftpay&&PAY){ go("data"); const m=PAY.restoreFromText(JSON.stringify(o.shiftpay)); if(m) toast(m); }
    return;
  }
  if(o&&o.app==="shiftpay"&&PAY){ go("data"); const m=PAY.restoreFromText(text); if(m) toast(m); return; }
  if(EXP){ go("exp"); await EXP.importFiles([new File([text],name||"expense_data.json")]); }
}
function toast(msg){ let t=$s("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),3500); }
document.addEventListener("change",e=>{ if(e.target&&e.target.id==="restoreFile"){ const f=e.target.files[0]; e.target.value=""; if(f) f.text().then(t=>restoreText(t,f.name)); } });

/* ---------- Bank SMS inside Shift Pay ---------- */
function ensure(id,where,pos,cls,tag){ let n=PAYM.root.getElementById(id); if(!n){ const at=PAYM.root.getElementById(where)||PAYM.root.querySelector(where); if(!at) return null;
  n=document.createElement(tag||"div"); n.id=id; if(cls) n.className=cls; at.insertAdjacentElement(pos,n); } return n; }
function refreshSalaryLine(){
  if(!PAY) return; const netBox=PAYM.root.getElementById("net"); if(!netBox) return;
  const n=ensure("smsActual",".net","afterend","sms-line"); if(!n) return;
  const m=PAY.S.mon, s=salaries().find(t=>payMonthOfCredit(t.date)===m);
  if(!s){ n.innerHTML=expTx().length?`No salary SMS for ${esc(monName(m))} yet. When it arrives, the real amount appears here.`:`Load your bank SMS in Expenses to compare with the real salary.`; return; }
  const r=predict(m), diff=r?s.amount-r.net:0, same=Math.abs(diff)<0.0015;
  n.innerHTML=`Received by bank SMS on ${dShort(s.date)}: <b>${k3(s.amount)} KWD</b>`+(r?` · ${same?'<span class="pos">✓ matches the prediction</span>':`difference <b class="${diff>0?"pos":"neg"}">${diff>0?"+":"−"}${k3(Math.abs(diff))}</b>`}`:"");
}
function refreshSpendCard(){
  const n=ensure("smsSpend","expenditure","afterbegin","exp-card sms-card"); if(!n) return; n.style.marginBottom="16px";
  const C=expCycles(); if(!C.length){ n.innerHTML=`<h2>Real spending (bank SMS)</h2><p class="hint">Load your bank SMS in Expenses to see what you actually spent next to this plan.</p>`; return; }
  const pm=PAY.S.mon, sal=MONL[+pm.slice(5)-1]+" salary", c=cycleForPayMonth(pm);
  if(!c){ n.innerHTML=`<h2>Real spending · bank SMS</h2><p class="hint">Your <b>${sal}</b> hasn't arrived in your bank SMS yet. Once it's credited, what you spend from it shows here.</p>`; return; }
  const V=EXP.computeView(c), L=catTotals(V).slice(0,4), last=c.end?new Date(c.end.getTime()-864e5):null;
  const span=dShort(c.start)+" – "+(last?dShort(last):"today");
  n.innerHTML=`<h2>Real spending · bank SMS</h2>
   <p class="hint" style="margin:4px 0 0">Your <b>${sal}</b> (paid ${dShort(c.salaryTx.date)}) pays for <b>${span}</b>${c.end?"":", until the next salary arrives"}.</p>
   <div class="sms-grid"><div><span>Spent</span><b>${k3(V.spent)}</b></div><div><span>Sent home</span><b>${k3(V.sentAmt)}</b></div>
   <div><span>Loan paid</span><b>${k3(V.loanAmt)}</b></div><div><span>Money now</span><b>${k3(V.current!=null?V.current:V.opening)}</b></div></div>
   ${L.map(([k,a])=>`<div class="sms-row"><span>${EXP.catIcon(k)}</span><div class="t">${esc(k)}</div><b>${k3(a)}</b></div>`).join("")}
   <div class="exp-actions"><button class="btn alt" type="button" data-sms="open">Open in Expenses</button></div>`;
}
function refreshFxCard(){
  const n=ensure("smsFx","fxpage","afterbegin","card sms-card"); if(!n) return;
  const R=remits().slice(0,25);
  if(!R.length){ n.innerHTML=`<h2>Transfers in bank SMS</h2><p class="sm">${expTx().length?"No money transfers home found in your bank SMS yet.":"Load your bank SMS in Expenses to find your transfers home automatically."}</p>`; return; }
  n.innerHTML=`<h2>Transfers in bank SMS</h2><p class="sm">Found automatically. Already in your list? It shows ✓. Otherwise tap <b>Add</b>: the amount paid and your usual fee are filled in — check the fee and type the rate. It is added to the month selected on the Salary tab (${esc(monName(PAY.S.mon))}).</p>`+
   R.map((t,i)=>{ const m=fxMatch(t); return `<div class="sms-row"><div class="t">${esc(t.merchant||"Transfer")}<small>${dShort(t.date)} ${t.date.getFullYear()}</small></div><b>${k3(t.amount)}</b>${m?`<span class="ok">✓ in list${(+m.fx.fee||m.fee)>0.0005?`<br><small style="font-weight:400;color:var(--i-2)">fee ${k3(+m.fx.fee||m.fee)}</small>`:""}</span>`:`<button class="btn" type="button" data-fx="${i}" style="min-height:34px;padding:6px 14px">Add</button>`}</div>`; }).join("");
  n._list=R;
}
/* Month name beside every Expenditure heading, so it's always clear which payroll month you're looking at. */
function refreshMonthTags(){
  const sec=PAYM.root.getElementById("expenditure"); if(!sec) return; const m=monName(PAY.S.mon);
  sec.querySelectorAll("h2,h3").forEach(h=>{ if(h.closest("#smsSpend")) return; let t=h.querySelector(".mtag");
    if(!t){ t=document.createElement("span"); t.className="mtag"; h.appendChild(t); } if(t.textContent!==m) t.textContent=m; });
}
function refreshLinks(){ if(!PAY||!PAYM) return; try{ calcCache.clear(); linkCache=null; refreshMonthTags(); refreshSalaryLine(); refreshSpendCard(); refreshFxCard(); }catch(e){ console.error(e); } }
if(PAYM&&PAYM.root){
  PAYM.root.addEventListener("click",e=>{
    const o=e.target.closest("[data-sms]"); if(o){ go("exp"); return; }
    const b=e.target.closest("[data-fx]"); if(!b) return;
    const t=(PAYM.root.getElementById("smsFx")._list||[])[+b.dataset.fx]; if(!t) return;
    go("expend");
    const el=id=>PAYM.root.getElementById(id);
    const fee=usualFee();
    el("fxDate").value=dayKey(t.date); el("fxAmt").value=String(Math.round(t.amount*1000)/1000);
    if(el("fxFee")&&fee&&fee<t.amount){ el("fxFee").value=String(fee); el("fxFee").dispatchEvent(new Event("input",{bubbles:true})); }
    el("fxAmt").dispatchEvent(new Event("input",{bubbles:true}));
    if(!el("fxNote").value) el("fxNote").value="From bank SMS: "+(t.merchant||"transfer");
    const card=el("fxCard"); if(card) card.scrollIntoView({block:"start"});
    setTimeout(()=>{ try{ el("fxRate").focus(); }catch(e){} },300);
  });
  const net=PAYM.root.getElementById("net"); let tm=null;
  if(net) new MutationObserver(()=>{ clearTimeout(tm); tm=setTimeout(()=>{ calcCache.clear(); refreshMonthTags(); refreshSalaryLine(); refreshSpendCard(); },60); }).observe(net,{childList:true,subtree:true,characterData:true});
}

/* Backups live in More › Backup & sync; hide the duplicate laptop sections inside Expenses settings. */
if(EXPM&&EXPM.root){ let st=null;
  new MutationObserver(()=>{ clearTimeout(st); st=setTimeout(()=>{
    EXPM.root.querySelectorAll(".sheet .sec").forEach(sec=>{ const h=sec.querySelector("h3"); if(!h||sec.dataset.moved) return;
      if(/iCloud sync|^\s*Save\s*$/i.test(h.textContent)){ sec.dataset.moved="1"; sec.style.display="none";
        if(!EXPM.root.getElementById("movedNote")){ const n=document.createElement("div"); n.id="movedNote"; n.className="sec";
          n.innerHTML='<h3>☁️ Backup &amp; sync</h3><div class="msg">Load new SMS, Save to iCloud and backups are all in <b>More › Backup &amp; sync</b>.</div><div class="btns"><button class="btn" type="button" id="goBackups">Open Backup &amp; sync</button></div>';
          sec.parentNode.insertBefore(n,sec); n.querySelector("#goBackups").onclick=()=>{ const x=EXPM.root.querySelector(".sheet-bg.on .sheet-h button"); if(x) x.click(); go("more"); }; } } });
  },0); }).observe(EXPM.root,{subtree:true,childList:true}); }

/* ---------- start ---------- */
let start="home"; try{ start=localStorage.getItem("money_tab")||"home"; }catch(e){}
go(PAGE[start]&&!SUB[start]?start:"home");
if(PAYM&&PAYM.root&&PAYM.root.querySelector("dialog[open]")) go("salary");
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
window.__money={go,renderHome,refreshLinks};
})();
